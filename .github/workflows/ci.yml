name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  # Public PyPI only. The runner has no private index configured, but pinning it
  # here makes the guarantee explicit rather than incidental (CLAUDE.md §0).
  PIP_INDEX_URL: https://pypi.org/simple

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Replays exactly the local hooks — pre-commit is bypassable with
      # --no-verify, so this job is the only real filter (CLAUDE.md §6).
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: coverage run -m pytest
      # `coverage report` is the gate: it exits non-zero below the fail_under
      # threshold set in pyproject.toml.
      - run: coverage report

  build:
    # Main only: with no registry and no cache yet, building on every PR spends
    # CI minutes on an artefact that is thrown away. To revisit the day a deploy
    # target exists.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      # Built, not pushed: the hosting target is not settled, so there is
      # nowhere to publish to yet. The job still proves the image builds.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: x-lookup-api:${{ github.sha }}
