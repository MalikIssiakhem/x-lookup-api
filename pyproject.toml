[tool.black]
line-length = 88

[tool.pycln]
all = true

[tool.isort]
line_length = 88
# Without this, isort files `from test.helpers import …` under the standard
# library and hoists it above pytest. Both packages are ours.
known_first_party = ["app", "test"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["test"]
# Auto mode: every `async def test_…` runs without a per-test marker. The whole
# application is async, so opting in test by test would be pure noise.
asyncio_mode = "auto"

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# The gate, not an indicator: `coverage report` fails the CI job below this.
# It goes up when coverage goes up and is never lowered to get an MR through —
# with no external quality gate on this repo, it is the only automatic guard
# rail left (CLAUDE.md §6).
fail_under = 95
